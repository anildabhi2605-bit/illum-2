[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illum-ai-studio"
version = "0.1.0"
description = "ILLUM AI Studio — YouTube Script, Video Prompts, Thumbnail & SEO Studio Workbench"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = { text = "Proprietary" }
authors = [{ name = "ILLUM AI Studio Team" }]
keywords = ["youtube", "video-generation", "prompts", "seo", "studio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "jinja2==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[project.scripts]
illum = "app.main:get_app_version"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
